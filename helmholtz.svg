<svg width="100%" viewBox="0 0 680 380" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Comment ça marche — Le résonateur de Helmholtz</title>
<desc>Une onde grave entre dans le col d'une bouteille, comprime l'air de la cavité, et l'énergie se dissipe en chaleur dans le col</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <linearGradient id="airgrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#3B8BD4" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#3B8BD4" stop-opacity="0.06"/>
  </linearGradient>
  <style>
    @keyframes wave-in { 0%{transform:translateX(-40px);opacity:0} 100%{transform:translateX(0);opacity:1} }
    @keyframes compress { 0%,40%{fill:rgba(59,139,212,0.10)} 60%,80%{fill:rgba(59,139,212,0.38)} 100%{fill:rgba(59,139,212,0.10)} }
    @keyframes heat { 0%,40%{opacity:0;r:2} 58%{opacity:1;r:7} 82%{opacity:0.2;r:4} 100%{opacity:0;r:2} }
    @keyframes pulse-col { 0%,100%{stroke:#EF9F27;stroke-width:1.5} 50%{stroke:#E85D24;stroke-width:3.5} }
    @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @media (prefers-reduced-motion: no-preference) {
      .wave1 { animation: wave-in 1.1s ease-out both 0s; }
      .wave2 { animation: wave-in 1.1s ease-out both .18s; }
      .wave3 { animation: wave-in 1.1s ease-out both .36s; }
      .cavity { animation: compress 2.6s ease-in-out infinite 1s; }
      .heat1 { animation: heat 2.6s ease-in-out infinite 1.1s; }
      .heat2 { animation: heat 2.6s ease-in-out infinite 1.4s; }
      .heat3 { animation: heat 2.6s ease-in-out infinite 1.7s; }
      .col-wall { animation: pulse-col 2.6s ease-in-out infinite 1s; }
      .bottle-g { animation: bob 4.2s ease-in-out infinite; }
    }
    .label-step { font-family: Arial, sans-serif; font-size: 9px; fill: #6a6458; letter-spacing: .14em; text-transform: uppercase; }
    .label-main { font-family: Arial, sans-serif; font-size: 11px; fill: #c0bcb0; }
    .label-accent { font-family: Arial, sans-serif; font-size: 11px; fill: #E85D24; }
    .label-result { font-family: Arial, sans-serif; font-size: 12px; fill: #e8e4d8; font-weight: 500; }
    .label-result-sub { font-family: Arial, sans-serif; font-size: 10px; fill: #6a9a88; }
    .label-freq { font-family: Arial, sans-serif; font-size: 11px; fill: #EF9F27; }
  </style>
</defs>

<!-- Fond -->
<rect width="680" height="380" fill="#08070a"/>

<!-- Titre -->
<text x="340" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#C8951A" letter-spacing="2">COMMENT ÇA MARCHE — RÉSONATEUR DE HELMHOLTZ</text>

<!-- Séparateurs verticaux -->
<line x1="145" y1="48" x2="145" y2="340" stroke="#1e1e2a" stroke-width="1"/>
<line x1="435" y1="48" x2="435" y2="340" stroke="#1e1e2a" stroke-width="1"/>

<!-- ══════════════════════
     ÉTAPE 1 — ONDE
     ══════════════════════ -->
<text x="72" y="58" text-anchor="middle" class="label-step">1 — onde grave</text>

<!-- Ondes animées -->
<g class="wave1">
  <path d="M28 120 Q36 100 44 120 Q52 140 60 120" fill="none" stroke="#EF9F27" stroke-width="2.4" stroke-linecap="round"/>
</g>
<g class="wave2">
  <path d="M18 120 Q30 92 42 120 Q54 148 66 120" fill="none" stroke="#EF9F27" stroke-width="1.7" stroke-linecap="round" opacity=".65"/>
</g>
<g class="wave3">
  <path d="M8 120 Q24 84 40 120 Q56 156 72 120" fill="none" stroke="#EF9F27" stroke-width="1.1" stroke-linecap="round" opacity=".35"/>
</g>
<line x1="76" y1="120" x2="160" y2="120" stroke="#EF9F27" stroke-width="1.4" marker-end="url(#arr)" opacity=".8"/>

<text x="42" y="178" text-anchor="middle" class="label-freq">f = f₀</text>
<text x="42" y="192" text-anchor="middle" class="label-freq">basse fréq.</text>
<text x="42" y="210" text-anchor="middle" class="label-main">Entre dans</text>
<text x="42" y="224" text-anchor="middle" class="label-main">le col ouvert</text>

<!-- ══════════════════════
     LA BOUTEILLE (centre)
     ══════════════════════ -->
<g class="bottle-g" style="transform-origin:270px 195px">
  <!-- Corps -->
  <path d="M200 315 Q164 312 152 276 Q140 240 142 182 Q142 120 160 100 Q178 80 216 74 L324 74 Q362 80 380 100 Q398 120 398 182 Q398 240 386 276 Q374 312 338 315 Z" class="cavity" fill="rgba(59,139,212,0.10)" stroke="#2a2a3a" stroke-width="1.8"/>
  <!-- Paroi intérieure légère -->
  <path d="M208 312 Q174 308 163 274 Q152 240 154 182 Q154 124 170 106 Q186 88 222 82 L318 82 Q354 88 370 106 Q386 124 386 182 Q386 240 375 274 Q364 308 330 312 Z" fill="none" stroke="#1e1e2a" stroke-width="0.8"/>
  <!-- Col gauche -->
  <line class="col-wall" x1="248" y1="28" x2="248" y2="74" stroke="#EF9F27" stroke-width="1.8"/>
  <!-- Col droit -->
  <line class="col-wall" x1="292" y1="28" x2="292" y2="74" stroke="#EF9F27" stroke-width="1.8"/>
  <!-- Embout ouvert pavillon -->
  <path d="M238 28 Q270 15 302 28" fill="none" stroke="#3a3a4a" stroke-width="1.5"/>
  <!-- Particules de chaleur dans le col -->
  <circle class="heat1" cx="260" cy="48" r="2" fill="#E85D24" opacity="0"/>
  <circle class="heat2" cx="278" cy="54" r="2" fill="#EF9F27" opacity="0"/>
  <circle class="heat3" cx="268" cy="40" r="2" fill="#E85D24" opacity="0"/>
  <!-- Label cavité -->
  <text x="270" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2a4a6a" letter-spacing="1">AIR</text>
  <text x="270" y="214" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#2a4a6a">↕ comprimé</text>
</g>

<!-- ══════════════════════
     ÉTAPE 2 — COMPRESSION
     ══════════════════════ -->
<text x="520" y="58" text-anchor="middle" class="label-step">2 — compression</text>

<line x1="436" y1="175" x2="460" y2="175" stroke="#2a2a3a" stroke-width="0.5" stroke-dasharray="3,3"/>
<text x="466" y="148" class="label-main">L'air de la cavité</text>
<text x="466" y="163" class="label-main">se comprime</text>
<text x="466" y="178" class="label-main">puis se détend</text>

<!-- Ressort -->
<path d="M508 198 L508 208 L498 214 L518 220 L498 226 L518 232 L498 238 L518 244 L508 250 L508 260" fill="none" stroke="#4a4a5a" stroke-width="1.5" stroke-linecap="round"/>
<text x="508" y="278" text-anchor="middle" font-family="Arial,sans-serif" font-size="9.5" fill="#4a4a5a">ressort d'air</text>

<!-- ══════════════════════
     ÉTAPE 3 — ABSORPTION
     ══════════════════════ -->
<text x="590" y="100" text-anchor="middle" class="label-main">Friction dans le col</text>
<text x="590" y="116" text-anchor="middle" class="label-main">énergie sonore →</text>
<text x="590" y="132" text-anchor="middle" class="label-accent">chaleur infime</text>

<!-- Flammes chaleur -->
<path d="M566 158 Q570 148 574 156 Q578 164 582 154 Q586 144 590 155 Q594 166 598 154 Q602 144 606 156 Q610 166 614 158" fill="none" stroke="#E85D24" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>
<path d="M570 170 Q574 162 578 170 Q582 178 586 168 Q590 160 594 170 Q598 180 602 170 Q606 162 610 170" fill="none" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round" opacity=".5"/>

<!-- ══════════════════════
     RÉSULTAT EN BAS
     ══════════════════════ -->
<rect x="88" y="332" width="504" height="38" rx="6" fill="#0d1a14" stroke="#1a3a28" stroke-width="0.8"/>
<text x="340" y="348" text-anchor="middle" class="label-result">Le son à cette fréquence disparaît.</text>
<text x="340" y="362" text-anchor="middle" class="label-result-sub">Converti en chaleur — principe de Helmholtz — 1860</text>

</svg>
