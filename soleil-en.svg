<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg" style="background:#08070a">
<style>
text { font-family: Arial, sans-serif; letter-spacing: 0; }
</style>
<!-- 16 radiating borosilicate tubes -->
<g stroke="rgba(180,220,255,0.55)" stroke-width="12" stroke-linecap="round" fill="none">
  <line x1="360" y1="330" x2="360" y2="130"/>
  <line x1="360" y1="330" x2="360" y2="530"/>
  <line x1="360" y1="330" x2="560" y2="330"/>
  <line x1="360" y1="330" x2="160" y2="330"/>
  <line x1="360" y1="330" x2="501" y2="189"/>
  <line x1="360" y1="330" x2="219" y2="189"/>
  <line x1="360" y1="330" x2="501" y2="471"/>
  <line x1="360" y1="330" x2="219" y2="471"/>
  <line x1="360" y1="330" x2="530" y2="245"/>
  <line x1="360" y1="330" x2="190" y2="245"/>
  <line x1="360" y1="330" x2="530" y2="415"/>
  <line x1="360" y1="330" x2="190" y2="415"/>
  <line x1="360" y1="330" x2="445" y2="145"/>
  <line x1="360" y1="330" x2="275" y2="145"/>
  <line x1="360" y1="330" x2="445" y2="515"/>
  <line x1="360" y1="330" x2="275" y2="515"/>
</g>
<!-- Glass reflections -->
<g stroke="rgba(255,255,255,0.22)" stroke-width="3" stroke-linecap="round" fill="none">
  <line x1="356" y1="330" x2="356" y2="135"/>
  <line x1="356" y1="330" x2="356" y2="525"/>
  <line x1="356" y1="330" x2="556" y2="330"/>
  <line x1="356" y1="330" x2="164" y2="330"/>
  <line x1="356" y1="330" x2="496" y2="193"/>
  <line x1="356" y1="330" x2="224" y2="193"/>
</g>
<!-- Tube tips -->
<g fill="rgba(200,230,255,0.35)" stroke="rgba(180,220,255,0.7)" stroke-width="1.2">
  <ellipse cx="360" cy="130" rx="8" ry="4"/>
  <ellipse cx="360" cy="530" rx="8" ry="4"/>
  <ellipse cx="560" cy="330" rx="4" ry="8"/>
  <ellipse cx="160" cy="330" rx="4" ry="8"/>
  <ellipse cx="501" cy="189" rx="6" ry="6" transform="rotate(-45,501,189)"/>
  <ellipse cx="219" cy="189" rx="6" ry="6" transform="rotate(45,219,189)"/>
  <ellipse cx="501" cy="471" rx="6" ry="6" transform="rotate(45,501,471)"/>
  <ellipse cx="219" cy="471" rx="6" ry="6" transform="rotate(-45,219,471)"/>
  <ellipse cx="530" cy="245" rx="5" ry="7" transform="rotate(-25,530,245)"/>
  <ellipse cx="190" cy="245" rx="5" ry="7" transform="rotate(25,190,245)"/>
  <ellipse cx="530" cy="415" rx="5" ry="7" transform="rotate(25,530,415)"/>
  <ellipse cx="190" cy="415" rx="5" ry="7" transform="rotate(-25,190,415)"/>
</g>
<!-- Central sphere — layers -->
<circle cx="360" cy="330" r="108" fill="#8a7240"/>
<circle cx="360" cy="330" r="90" fill="#7a9a6a"/>
<circle cx="360" cy="330" r="62" fill="#5a7080"/>
<!-- Internal Helmholtz channels -->
<g fill="#90b8e0" stroke="#3a5878" stroke-width="0.8" opacity="0.9">
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(0,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(45,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(90,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(135,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(180,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(225,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(270,360,330)"/>
  <rect x="353" y="252" width="14" height="78" rx="4" transform="rotate(315,360,330)"/>
</g>
<!-- Central PE cavity -->
<circle cx="360" cy="330" r="36" fill="#4878a0"/>
<defs>
  <radialGradient id="goldgrad2" cx="40%" cy="35%">
    <stop offset="0%" stop-color="#e8c860" stop-opacity="0.8"/>
    <stop offset="60%" stop-color="#b89030" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#4878a0" stop-opacity="0"/>
  </radialGradient>
  <marker id="arrg2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M1 1L9 5L1 9" fill="none" stroke="#C8951A" stroke-width="1.5" stroke-linecap="round"/>
  </marker>
</defs>
<circle cx="360" cy="330" r="36" fill="url(#goldgrad2)"/>
<!-- Outlines -->
<circle cx="360" cy="330" r="108" fill="none" stroke="#5a4820" stroke-width="1.5"/>
<circle cx="360" cy="330" r="90" fill="none" stroke="#5a7848" stroke-width="0.5" stroke-dasharray="5,3"/>
<circle cx="360" cy="330" r="62" fill="none" stroke="#4a6070" stroke-width="1"/>
<circle cx="360" cy="330" r="36" fill="none" stroke="#3a6888" stroke-width="1.2"/>
<!-- Brass connectors -->
<g fill="#c8a830" stroke="#8a7020" stroke-width="0.5">
  <circle cx="360" cy="222" r="7"/><circle cx="360" cy="438" r="7"/>
  <circle cx="468" cy="330" r="7"/><circle cx="252" cy="330" r="7"/>
  <circle cx="438" cy="252" r="7"/><circle cx="282" cy="252" r="7"/>
  <circle cx="438" cy="408" r="7"/><circle cx="282" cy="408" r="7"/>
  <circle cx="456" cy="288" r="6"/><circle cx="264" cy="288" r="6"/>
  <circle cx="456" cy="372" r="6"/><circle cx="264" cy="372" r="6"/>
</g>
<!-- Suspension cable -->
<line x1="360" y1="222" x2="360" y2="168" stroke="#a0b8c8" stroke-width="3" stroke-linecap="round"/>
<line x1="360" y1="170" x2="360" y2="148" stroke="#a0b8c8" stroke-width="2"/>
<ellipse cx="360" cy="145" rx="16" ry="6" fill="#5a7080"/>
<text x="382" y="142" font-size="8.5" fill="#7a9aaa">3mm stainless steel cable</text>
<!-- Incoming waves -->
<path d="M570 310 Q582 320 570 330" fill="none" stroke="#C8951A" stroke-width="1.2" opacity="0.8"/>
<path d="M578 305 Q594 320 578 335" fill="none" stroke="#C8951A" stroke-width="1" opacity="0.55"/>
<path d="M586 300 Q606 320 586 340" fill="none" stroke="#C8951A" stroke-width="0.8" opacity="0.3"/>
<line x1="570" y1="320" x2="560" y2="320" stroke="#C8951A" stroke-width="1.2" marker-end="url(#arrg2)"/>
<text x="592" y="356" font-size="8" fill="#C8951A">waves</text>
<text x="592" y="367" font-size="8" fill="#C8951A">80-200 Hz</text>
<!-- Legend -->
<text x="620" y="82" font-size="9" fill="#C8951A">MATERIALS</text>
<rect x="620" y="90" width="16" height="11" rx="2" fill="rgba(180,220,255,0.5)" stroke="rgba(180,220,255,0.7)" stroke-width="1"/>
<text x="642" y="100" font-size="9" fill="#c0bcb0">Borosilicate tubes 25mm L=600mm</text>
<text x="642" y="111" font-size="8" fill="#5a5848">Open axial channel - flared tip</text>
<rect x="620" y="118" width="16" height="11" rx="2" fill="#8a7240"/>
<text x="642" y="128" font-size="9" fill="#c0bcb0">Acoustic PET felt 18mm gold</text>
<rect x="620" y="135" width="16" height="11" rx="2" fill="#7a9a6a"/>
<text x="642" y="145" font-size="9" fill="#c0bcb0">Melamine foam Basotect 28mm</text>
<rect x="620" y="152" width="16" height="11" rx="2" fill="#5a7080"/>
<text x="642" y="162" font-size="9" fill="#c0bcb0">CNC welded aluminium frame 8mm</text>
<rect x="620" y="169" width="16" height="11" rx="2" fill="#90b8e0"/>
<text x="642" y="179" font-size="9" fill="#c0bcb0">PVC Helmholtz channels 40mm x8</text>
<rect x="620" y="186" width="16" height="11" rx="2" fill="#4878a0"/>
<text x="642" y="196" font-size="9" fill="#c0bcb0">Central PE cavity 8 litres</text>
<rect x="620" y="203" width="16" height="11" rx="2" fill="#c8a830"/>
<text x="642" y="213" font-size="9" fill="#c0bcb0">Brass connectors tube/sphere junction</text>
<!-- Dual absorption system -->
<rect x="620" y="235" width="355" height="300" rx="5" fill="#0c0a08" stroke="#2a2018" stroke-width="0.8"/>
<text x="797" y="256" text-anchor="middle" font-size="9" fill="#C8951A">DUAL ABSORPTION SYSTEM</text>
<text x="630" y="276" font-size="8.5" fill="#c8d8f0" font-weight="bold">1 - BOROSILICATE TUBES - Long-range Helmholtz</text>
<text x="630" y="290" font-size="8" fill="#6a6858">L = 600mm 25mm - f0 55-75 Hz</text>
<text x="630" y="302" font-size="8" fill="#6a6858">16 radiating tubes = 16 resonators</text>
<text x="630" y="314" font-size="8" fill="#6a6858">Flared bell tip for directional capture</text>
<text x="630" y="326" font-size="8" fill="#C8951A">Absorbs low room frequencies</text>
<line x1="630" y1="334" x2="965" y2="334" stroke="#2a2018" stroke-width="0.5"/>
<text x="630" y="350" font-size="8.5" fill="#90b8e0" font-weight="bold">2 - INTERNAL CHANNELS - Short-range Helmholtz</text>
<text x="630" y="364" font-size="8" fill="#6a6858">L = 280mm 40mm - f0 100-160 Hz</text>
<text x="630" y="376" font-size="8" fill="#6a6858">8 channels body to PE cavity 8L</text>
<text x="630" y="388" font-size="8" fill="#6a6858">Covers the band not handled by the tubes</text>
<text x="630" y="400" font-size="8" fill="#C8951A">Absorbs mid-bass frequencies</text>
<line x1="630" y1="408" x2="965" y2="408" stroke="#2a2018" stroke-width="0.5"/>
<text x="630" y="424" font-size="8.5" fill="#7a9a6a" font-weight="bold">3 - MELAMINE FOAM - Broadband absorption</text>
<text x="630" y="438" font-size="8" fill="#6a6858">Basotect 28mm between PET felt and alu frame</text>
<text x="630" y="450" font-size="8" fill="#6a6858">Coefficient alpha 0.85 at 500 Hz - 4 kHz</text>
<text x="630" y="462" font-size="8" fill="#6a6858">Absorbs mids and treble</text>
<text x="630" y="474" font-size="8" fill="#C8951A">Absorbs voice, hubbub, speech frequencies</text>
<line x1="630" y1="482" x2="965" y2="482" stroke="#2a2018" stroke-width="0.5"/>
<text x="630" y="498" font-size="8.5" fill="#e8e4d8">Combined total coverage:</text>
<text x="630" y="512" font-size="9" fill="#C8951A" font-weight="bold">55 Hz - 4 kHz  avg. alpha 0.80</text>
<text x="630" y="524" font-size="8" fill="#4a4838">*indicative estimate without on-site measurement</text>
<!-- Dimension annotations -->
<line x1="360" y1="330" x2="360" y2="130" stroke="#C8951A" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.5"/>
<line x1="355" y1="130" x2="365" y2="130" stroke="#C8951A" stroke-width="1"/>
<line x1="355" y1="222" x2="365" y2="222" stroke="#C8951A" stroke-width="1"/>
<text x="370" y="178" font-size="8" fill="#C8951A">600mm</text>
<text x="370" y="189" font-size="7.5" fill="#6a6858">boros. tube</text>
<line x1="252" y1="330" x2="360" y2="330" stroke="#C8951A" stroke-width="0.6" stroke-dasharray="3,3" opacity="0.5"/>
<text x="290" y="320" font-size="8" fill="#5a4820">Sphere</text>
<text x="290" y="331" font-size="8" fill="#5a4820">216mm</text>
<line x1="160" y1="560" x2="560" y2="560" stroke="#C8951A" stroke-width="0.8"/>
<line x1="160" y1="555" x2="160" y2="565" stroke="#C8951A" stroke-width="1"/>
<line x1="560" y1="555" x2="560" y2="565" stroke="#C8951A" stroke-width="1"/>
<text x="360" y="575" text-anchor="middle" font-size="9" fill="#C8951A">Total diameter 4m (sphere + tubes)</text>
<!-- Disclaimer -->
<text x="500" y="664" text-anchor="middle" font-size="8" fill="#2a2018">Indicative non-contractual diagram - AeroCalme 2026</text>
</svg>
